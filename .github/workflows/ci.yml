name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: JavaScript syntax
        run: node --check Sources/IssuesDesktop/Web/app.js
      - name: Core regression tests
        run: zsh scripts/test-core.sh
      - name: Desktop regression tests
        run: bash scripts/test-desktop.sh
      - name: Build macOS app
        run: bash scripts/build-app.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict release/Issues.app
